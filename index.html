<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conversor</title>
  </head>
  <body>
    <h1>Conversor de divisas a CLP</h1>
    <section id="box-interactivo">
        <h2>Pesos en CLP</h2>
      <input type="number" aria-label="Rap" />
      <p>Moneda a convertir:</p>
      <select name="divisa" id="divisas">
        <option value="1">Euro</option>
        <option value="2">Dolar</option>
        <option value="3">UF</option>
        <option value="4">Libra Cobre</option>
        <option value="5">Wuajaja trol xd</option>
      </select>
      <button id="btn-conversion">Conversión</button>
      <span id="resultado-conversion"></span>
    </section>
  </body>
</html>
